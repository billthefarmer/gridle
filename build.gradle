buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    // tasks.withType(JavaCompile) {
    //     options.deprecation = true
    // }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    namespace = "org.billthefarmer.gridle"

    defaultConfig {
        applicationId = "org.billthefarmer.gridle"
        minSdkVersion 21
        targetSdkVersion 35
        versionName "1.23"
        versionCode 123

        buildConfigField "long", "BUILT", System.currentTimeMillis() + "L"
    }

    lintOptions {
        disable 'NonConstantResourceId', 'ExpiredTargetSdkVersion', 'GradleDependency',
            'ClickableViewAccessibility', 'SetJavaScriptEnabled', 'SetTextI18n',
	    'AndroidGradlePluginVersion', 'OldTargetApi', 'DiscouragedApi'
        // abortOnError false
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    dependencies {
        implementation 'com.google.zxing:core:3.5.4'
        implementation 'nl.dionsegijn:konfetti-xml:2.0.5'
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    }
}
